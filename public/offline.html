<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Infrared -- Offline</title>
        <link rel="stylesheet" href="/style/style.css">
        <style>
            .offline-container {
                text-align: center;
                margin-top: 50px;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }
            p {
                font-size: 18px;
                color: #555;
            }
            button {
                padding: 10px 20px;
                font-size: 16px;
                background-color: #007BFF;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                width: 150px;
                align-self: center;
            }
            button:hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <div class="offline-container">
            <h1>Infrared is offline</h1>
            <p>It seems you are currently offline. Please check your internet connection and try again.</p>
            <button onclick="location.reload()">Retry</button>
        </div>
    </body>
</html>
