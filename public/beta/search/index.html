<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrared -- Search</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .cont {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1rem;
        }
        .holder {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="cont">
        <h1>Search Page</h1>
        <p>This is the search page of Infrared.</p>
        <div class="holder">
            <input autofocus type="text" placeholder="Search..." style="padding: 0.5rem; font-size: 1rem; width: 300px;">
            <button style="padding: 0.5rem 1rem; font-size: 1rem; margin-left: 0.5rem;">Search</button>
        </div>
        <div id="history">
            Search something to get started. Your search history will appear here.
        </div>
    </div>
<script>
const historyDiv = document.getElementById('history');
const searchInput = document.querySelector('input');
const searchButton = document.querySelector('button');

searchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        search();
    }
});

const searchHistory = JSON.parse(localStorage.getItem('searchHistory')) || [];
if (searchHistory.length > 0) {
    historyDiv.innerHTML = '<h2>Search History:</h2><ul>' +
        searchHistory.map(term => `<li>${term}</li>`).join('') + '</ul>';
}

function load() {
    if (window.location.search) {
        const params = new URLSearchParams(window.location.search);
        const query = params.get('q');
        if (query) {
            window.location.href = `https://google.com/search?q=${encodeURIComponent(query)}`;
            searchHistory.push(query);
            localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
            historyDiv.innerHTML = '<h2>Search History:</h2><ul>' +
                searchHistory.map(term => `<li>${term}</li>`).join('') + '</ul>';
        }
    }
}

function search() {
    const searchTerm = searchInput.value;
    if (searchTerm) {
        window.location.href = `/beta/search?q=${encodeURIComponent(searchTerm)}`;
    }
}

searchButton.addEventListener('click', () => {
    search();
});
load();
</script>
</body>
</html>
