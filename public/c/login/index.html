<!DOCTYPE html>
<html lang="en">
    <title>InfraRed -- Login</title>
    <head>
        <link rel="icon" href="/favicon.ico">
        <link rel="stylesheet" href="/style/style.css">
        <style>
            .header {
                margin-bottom: 0px;
            }
            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 30px;
                height: 85vh;
                width: 100%;
                background-color: rgba(150, 90, 0, 0.4);
                border-radius: 20px;
            }
            .login-area {
                border: 4px solid black;
                background-color: rgb(255, 255, 255);
                border-radius: 20px;
                padding: 40px;
                display: flex;
                gap: 20px;
                flex-direction: column;
            }
            #msg {
                background-color: rgb(255, 255, 255);
                border: 2px solid rgb(0, 178, 254);
                padding: 8px;
                border-radius: 8px;
                color: rgb(0, 0, 0);
                font-size: 16px;
            }
            input {
                background-color: rgb(255, 255, 255);
                border: 2px solid black;
                padding: 20px;
                border-radius: 8px;
                color: rgb(0, 0, 0);
                font-size: 16px;
            }
            .login-btn {
                color: black;
                border: 2px solid;
                background-color:rgb(255, 255, 255)
            }
        </style>
        <script src="/socket.io/socket.io.js"></script>
    </head>
    <body>
        <div class="header">
            <a class="h1" href="/c/home/">
                Infra<span>Red</span>
            </a>
            <a href="/c/dashboard/">Dashboard</a>
            <a href="/c/about/">About</a>
            <a href="/c/feedback/">Feedback</a>
            <a href="/legal/tos/">TOS</a>
            <a href="/c/login/" class="login-btn" style="background: rgba(255, 255, 255, 0);">Login</a>
            <a href="/c/register/" class="login-btn" style="background: rgba(255, 255, 255, 0);">Register</a>
        </div>
        <div class="container">
            <div class="login-area">
                <div id="msg">Please log-in </div>
                <input id="username-inp" type="text" placeholder="Enter Username here..."/>
                <input id="password-inp" type="password" placeholder="Enter Password here...">
                <div id="mssgg"></div>
                <button id="login-btn" onclick="verifyLogin()" class="login-btn">Authenticate Login</button>
                <div style="color: black;">Don't have an account? <button id="login-btn" onclick="window.location.href='/c/register' + window.location.search" class="login-btn">Register Now</button></div>
            </div>
        </div>
<script src="/script.js"></script>
<script>
const btn = document.getElementById('login-btn');
const usrnm = document.getElementById('username-inp');
const pass = document.getElementById('password-inp');
const {redir} = geturlparms();
usrnm.focus();
usrnm.addEventListener('keydown', (key) => {
    if (key.key === "Enter") {
        pass.focus();
    };
});
pass.addEventListener('keydown', (key) => {
    if (key.key === "Enter") {
        verifyLogin();
    };
});

function allert(inp) {
    const msg = document.getElementById('mssgg')
    msg.innerHTML = inp
    msg.style = `
    color: red;
    display: block;
    width: max-content;
    margin: auto;`
}

function verifyLogin(){
    if (usrnm.value != '' && pass.value != '') {
        socket.emit('Login', usrnm.value.trim(), pass.value, (callback) => {
            if (callback.key && callback.username) {
                document.cookie = `key=${encodeURIComponent(callback.key)}; path=/; max-age=3600; SameSite=Lax`;
                document.cookie = `usrnm=${encodeURIComponent(callback.username)}; path=/; max-age=3600; SameSite=Lax`;
                window.location.href = redir;
            } else if (callback.error) {
                allert('Error: ' + callback.error);
            }
        });
    };
};

const msgdiv = document.getElementById('msg');
msgdiv.innerHTML += get()
function get(){
    switch (redir) {
        case '/c/about/':
            return 'before going to about page'
        case '/c/chat/':
            return 'to go to chat page';
        case '/c/dashboard/':
            return 'to go to your dashboard';
        case '/c/feedback/':
            return 'to give feedback';
        case '/legal/tos/':
            return 'to view TOS';
        case '/play/eag/188':
            return 'if you want to play eaglercraft 1.8.8'
        case '/play/eag/112':
            return 'if you want to play eaglercraft 1.12.2'
        case '/play/eag/126':
            return 'if you want to play eaglercraft 1.26.2'
        case '/play/hkn/':
            return 'to continue to hollow knight'
        case '/play/esc/':
            return 'to play escape road'
        case '/play/rtb/clg/':
            return 'to play retro bowl college'
        default:
            return 'to continue'
    }
}
</script>
</body>
</html>
