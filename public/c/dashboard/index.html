<style>
#cont-large{
    display: flex;
}
.cont {
    background: rgb(180, 117, 117);
    padding: 12px;
    border-radius: 4px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    width: 50%;
}

.room {
    background: black;
    border: 4px solid burlywood;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 10px;
}
.users {
    display: flex;
    background: blueviolet;
    flex-direction: column;
    gap: 15px;
    font-size: 20px;
    padding: 10px;
}
.users span {
    background: white;
    color: black;
}
.login-btn{
    font-size: 30px;
}

.games-cont{
    border: 3px solid black;
    padding: 8px;
    margin: 8px;
    display: flex;
}
.game {
    border: 3px solid black;
    margin: 2px;
    flex: 1;
}
.name {
    font-size: 30px;
    margin: 4px;
}
.desc {
    color: gray;
}
.launch-game {
    background-color: gold;
    color: black;
    padding: 4px;
    border-radius: 6px;
    cursor: pointer;
    margin: 8px;
    font-size: 20px;
    transition: all 0.2s ease-in-out;
}
.launch-game:hover {
    box-shadow: 0 0 40px;
    font-size: 24px;
}
.launch-game:active {
    font-size: 16px;
}

        <div class="header">
            <a class="h1" href="/c/home/">

            <div id="cont">Log in to continue, redirecting...</div>
        </div>
<script src="/socket.io/socket.io.js"></script>
<script src="/script.js"></script>
<script>

login_key(getcookie('usrnm'), getcookie('key'))

async function addRooms(rooms) {
    const cont = document.getElementById('cont');
    cont.innerHTML = '';
    cont.className = 'cont';
    for (const room in rooms) {
        const div = document.createElement('div');
        div.innerHTML = `
        <a class="login-btn" href="/c/chat?r=${room}">${room}</a>
        <p>${rooms[room].users.length} Users</p>
        <div class="users" id="users-${room}">${rooms[room].users.map(u => u).join('<br>')}</div>`
        div.className = 'room'
        cont.appendChild(div);
    };
}

socket.emit("get-rooms", (callback) => {
    addRooms(callback.rooms)
})

const gamesmenu = `
            <div class="games-cont">
                <div class="game">
                    <div class="name">Eaglercraft</div>
                    <div class="desc">Eaglercraft is a free, open-source project that allows users to play Minecraft Java Edition directly within a standard web browser without requiring any downloads, installations, or paid accounts. Originally created by an independent developer known as LAX1DUDE, it compiles Mojang’s official game assets into JavaScript and WebAssembly using a tool called TeaVM. This process allows a fully functional version of the game to run smoothly inside a web browser.</div>
                    <button class="launch-game" onclick="window.location.href='/play/eag';">Launch</button>
                </div>
                <div class="game">
                    <div class="name">Hollow Knight</div>
                    <div class="desc">Hollow Knight is a 2D action-adventure video game developed and published by Team Cherry in February 2017. You play as a small, silent knight exploring a vast, ruined underground kingdom called Hallownest. The game belongs to a genre called "Metroidvania," which means you explore a giant connected map, unlock new movement abilities, and return to areas you could not reach before.</div>
                    <button class="launch-game" onclick="window.location.href='/play/hkn';">Launch</button>
                </div>
                <div class="game">
                    <div class="name">Escape Road 2</div>
                    <div class="desc">Escape Road 2 is a fast-paced, blocky, low-poly driving and action game where you play as a getaway driver fleeing a massive police pursuit after a bank heist</div>
                    <button class="launch-game" onclick="window.location.href='/play/esc';">Launch</button>
                </div>
            </div>
`
setTimeout(function() {
    document.getElementById('cont-large').innerHTML += gamesmenu
}, 1000)
</script>
