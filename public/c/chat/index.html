<!DOCTYPE html>
<html lang="en">
    <title>InfraRed -- Chat</title>
    <head>
        <link rel="icon" href="/favicon.ico">
        <link rel="stylesheet" href="/style/style.css">
        <script src="/socket.io/socket.io.js"></script>
        <style>
            #msg-cont {
                background: rgba(0, 0, 0, 0.5);
                border-radius: 20px 20px 0 0;
                color: white;
                margin: 20px;
                margin-bottom: 0;
                padding: 20px;
                height: 60vh;
                overflow-y: auto;
                overflow-x: hidden;
                display: flex;
                flex-direction: column;
                align-items: stretch;
            }
            .msg-card {
                background: rgba(255, 0, 0, 0.7);
                padding: 8px;
                margin: 8px;
                border-radius: 4px;
                overflow-wrap: anywhere;
                animation: slide_from_left 500ms ease-out;
            }
            .msg-system {
                align-self: center;
                width: 50%;
                max-width: 75%;
                background: rgba(255, 0, 0, 0.7);
                padding: 16px;
                margin: 8px;
                border-radius: 4px;
                overflow-wrap: break-word;
                animation: slide_from_left 500ms ease-out;
            }
            .input-holder{
                background: rgba(0, 0, 0, 0.5);
                color: black;
                padding: 20px;
                border-radius: 0 0 8px 8px;
                margin: 20px;
                margin-top: 0;
            }
            #msg-inp {
                padding: 8px;
                color: black;
                width: 80%;
                margin-right: 0;
            }
            #send {
                border-radius: 0 5px 5px 0;
                padding: 5px;
                margin-left: 0;
                color: black;
                font-size: 18px;
                background: rgb(0, 255, 0);
            }
            @keyframes slide_from_left {
                from{
                    transform: translateX(-50px);
                    opacity: 0;
                }
                to{
                    transform: translateX(0px);
                    opacity: 1;
                }
            }
            .helpmsg {
                align-self: center;
                width: 50%;
                max-width: 75%;
                background: rgba(255, 0, 0, 0.7);
                padding: 8px;
                margin: 8px;
                border-radius: 4px;
                overflow-wrap: break-word;
                animation: slide_from_left 500ms ease-out;
            }
            .desc div {
                font-weight: bold;
                padding: 4px;
                background: rgba(0, 0, 0, 0.3);
                border-radius: 4px;
                width: fit-content;
            }
            .desc {
                padding: 4px;
                width: fit-content;
                background: rgba(0, 0, 0, 0.3);
                border-radius: 4px;
                display: flex;     
                flex-direction: row;
                margin: 4px;
            }
            .desc span {
                margin: 4px;
            }
            ul, ol {
                margin: 8px, 0;
                padding-left: 20px;
                list-style-position: inside;
            }
            .msg-card p {
                margin: 0;
                padding: 0;
                border: 0;
                display: inline;
            }
            .msg-card p {
                margin: 0;
                padding: 0;
                border: 0;
                display: inline;
            }
            code {
                background: rgba(0, 0, 0, 0.4);
                color: white;
                padding: 2px 4px;
                max-width: 100%;
                overflow-wrap: anywhere;
                border-radius: 4px;
            }
            table {
                border-collapse: collapse;
                width: 100%;
                padding: 8px;
            }
            table, th, td {
                border: 1px solid #ddd;
            }
            #typing-indicator {
                font-style: monospace;
                color: white;
                height: 20px;
                display: block;
                visibility: hidden;
                margin: 10px 20px;
                background: rgba(0, 0, 0, 0.5);
            }
        </style>
    </head>
    <body>
        <div class="header">
            <a class="h1" href="/c/home/">
                Infra<span>Red</span>
            </a>
            <a href="/c/dashboard/">Dashboard</a>
            <a href="/c/about/">About</a>
            <a href="/c/feedback/">Feedback</a>
            <a href="/legal/tos/">TOS</a>
            <a href="/c/login/" class="login-btn">Login</a>
            <a href="/c/register/" class="login-btn" style="background: rgba(255, 255, 255, 0);">Register</a>
        </div>
        <div id="msg-cont">
        </div>
        <div id="typing-indicator"></div>
        <div class="input-holder">
            <input id="msg-inp">
            <button id="send">▶</button>
        </div>
<script src="/script.js"></script>
<script>
// the real code
const msgcont = document.getElementById('msg-cont');
const input = document.getElementById('msg-inp');
const btn = document.getElementById('send');
const { room } = geturlparms();
let unreadmsgs = 0;
let blurred = false;
//verify cookie validation
socket.on('connect', () => {
    login_key(getcookie('usrnm'), getcookie('key'));
    input.focus();
    msgcont.innerHTML = '';
    socket.emit('get-msgs', (msgs) => {
        msgs.forEach(msg => {
            addMessage(msg.username, msg.message, msg.rank.toUpperCase(), msg.level);
        });
        socket.emit('get-announcements', (announcements) => {
            announcements.forEach(announcement => {
                addMessage('SYSTEM', `<h2>${announcement.message}</h2>`, 'system', 0);
            });
            msgcont.scrollTop = msgcont.scrollHeight;
        });
    });
});
input.focus();

btn.onclick = () => {
    sendMessage(input.value);
    input.value = '';
}

input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){
        sendMessage(input.value);
        input.value = '';
    };
});
input.addEventListener('input', () => {
    socket.emit('typing', input.value.length > 0);
});

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        blurred = false;
        unreadmsgs = 0;
        document.title = 'InfraRed -- Chat';
    } else {
        blurred = true;
    }
});

const helpmsg = `
        <p>
            <div class='helpmsg'>
                <div class="desc"><div>/help</div><span>Shows the help message (this one)</span>                                              <div>everyone</div></div>
                <div class="desc"><div>/clear</div><span>Clears the chat for everyone </span>                                                 <div>moderator</div></div>
                <div class="desc"><div>/kick [username] &lt;reason&gt;</div><span>Kicks a user from the chat </span>                          <div>moderator</div></div>
                <div class="desc"><div>/ban [username] [time] &lt;reason&gt;</div><span>Bans a user from the chat </span>                     <div>moderator</div></div>
                <div class="desc"><div>/unban [username]</div><span>Unbans a user from the chat </span>                                       <div>moderator</div></div>
                <div class="desc"><div>/mute [username] [time] &lt;reason&gt;</div><span>Mutes a user from the chat </span>                   <div>moderator</div></div>
                <div class="desc"><div>/unmute [username]</div><span>Unmutes a user from the chat </span>                                     <div>moderator</div></span></div>
                <div class="desc"><div>/exec [command]</div><span>Executes some code on everyones computer </span>                            <div>admin</div></span></div>
                <div class="desc"><div>/grant [username] [rank]</div><span>Grants a rank to a user </span>                                    <div>admin</div></span></div>
                <div class="desc"><div>/kill &lt;reason&gt;</div><span>Crashes the server </span>                                             <div>owner</div></span></div>
                <div class="desc"><div>/lock</div><span>Locks or unlocks the chat </span>                                                     <div>admin</div></span></div>
                <div class="desc"><div>/msg [username] [message]</div><span>Sends a direct message to a user (messages are logged) </span>    <div>everyone</div></div>
                <div class="desc"><div>/ai [message]</div><span>Asks the ai something</span>                                                  <div>Premium</div></div>
            </div>
        </p>
`;

function showhelpmsg(){
    const bottom = msgcont.scrollHeight - msgcont.scrollTop <= msgcont.clientHeight + 1;
    msgcont.innerHTML += helpmsg;
    if (bottom) {
        msgcont.scrollTop = msgcont.scrollHeight;
    }
}

function addMessage(username, message, rank, level){
    if (message != ''){
        const bottom = msgcont.scrollHeight - msgcont.scrollTop <= msgcont.clientHeight + 1;
        const msgcard = document.createElement('div');
        if (username === 'SYSTEM'){
            msgcard.className = 'msg-system';
            msgcard.innerHTML = message
        } else {
            msgcard.className = 'msg-card';
            msgcard.innerHTML = `[${rank}] [Level ${level}] ${username} >>  ${message}`;
        }
        const links = msgcard.querySelectorAll('a');
        links.forEach(link => {
            link.setAttribute('target', '_blank');
            link.setAttribute('rel', 'noopener noreferrer');
        });
        msgcont.appendChild(msgcard);
        if (bottom) {
            msgcont.scrollTop = msgcont.scrollHeight;
        }
    }
    if(blurred){
        unreadmsgs++;
        document.title = `(${unreadmsgs}) InfraRed -- Chat`;
    }
}

function sendMessage(message){
    if (message === '/help'){
        showhelpmsg();
        input.value = '';
        return;
    }
    socket.emit('Chat-msg', message);
    input.focus()
};

socket.on('typing', (typingusers) => {
    const typingIndicator = document.getElementById('typing-indicator');
    if (Object.keys(typingusers).length === 0) {
        typingIndicator.style.visibility = 'hidden';
        return;
    }
    typingIndicator.textContent = `${Object.keys(typingusers).join(', ')} is typing...`;
    typingIndicator.style.visibility = 'visible';
});

socket.on('Chat-msg', (username, message, rank, level) => {
    addMessage(username, message, rank.toUpperCase(), level);
});
socket.on('exec', (command) => {
    try{
        eval(command);
    } catch (e) {
        alert(e);
    }
})

socket.on('clear', () => {
    msgcont.innerHTML = '';
})

window.addEventListener('offline', () => {
    addMessage('SYSTEM', 'You\'re offline', 'system')
})
window.addEventListener('online', () => {
    addMessage('SYSTEM', 'You\'re back online', 'system')
})
socket.on('disconnect', () => {
    addMessage('SYSTEM', 'Disconnected from server', 'system')
})
</script>
</body>
</html>
