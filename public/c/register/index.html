<!DOCTYPE html>
<html lang="en">
    <title>InfraRed -- Register</title>
    <head>
        <link rel="icon" href="/favicon.ico">
        <link rel="stylesheet" href="/style/style.css">
        <style>
            .header {
                margin-bottom: 0px;
            }
            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 30px;
                height: 85vh;
                width: 100%;
                background-color: rgba(150, 90, 0, 0.4);
                border-radius: 20px;
            }
            .login-area {
                border: 4px solid black;
                background-color: rgb(255, 255, 255);
                border-radius: 20px;
                padding: 40px;
                display: flex;
                gap: 20px;
                flex-direction: column;
            }
            input {
                background-color: rgb(255, 255, 255);
                border: 2px solid black;
                padding: 20px;
                border-radius: 8px;
                color: rgb(0, 0, 0);
                font-size: 16px;
            }
            .login-btn {
                color: black;
                border: 2px solid;
                background-color:rgb(255, 255, 255);
            }
            .vcdcont{
                padding: 4px;
                border: 4px solid gray;
            }
            .vcdcont span {
                color: black;
            }
            .login-area div input{
                cursor: pointer;
            }
        </style>
        <script src="/socket.io/socket.io.js"></script>
    </head>
    <body>
        <div class="header">
            <a class="h1" href="/c/home/">
                Infra<span>Red</span>
            </a>
            <a href="/c/dashboard/">Dashboard</a>
            <a href="/c/about/">About</a>
            <a href="/c/feedback/">Feedback</a>
            <a href="/legal/tos/">TOS</a>
            <a href="/c/login/" class="login-btn" style="background: rgba(255, 255, 255, 0);">Login</a>
            <a href="/c/register/" class="login-btn" style="background: rgba(255, 255, 255, 0);">Register</a>
        </div>
        <div class="container">
            <div id="log" class="login-area">
                    <input id="username-inp" type="text" placeholder="Username:"/>
                    <input id="email-inp" type="email" placeholder="Email:"/>
                    <input id="password-inp" type="password" placeholder="Password:">
                    <input id="password-inp2" type="password" placeholder="Confirm Password:"/>
                    <div style="color: black;"><input type="checkbox" id="checkbox"> I agree to the <a style="color: black;" target ="_blank" href="/legal/tos/"> Terms and conditions</a></div>
                    <div id="mssgg"></div>
                    <button id="login-btn" onclick="verifyLogin()" class="login-btn">Send code</button>
                <div style="color: black;">Already have an account? <button type="button" class="login-btn" onclick="window.location.href=`/c/login?${window.location.search.slice(1)}`;">Login Here</button></div>
            </div>
            <div id="vcd" class="login-area" style="display: none;">
                <input id="vcode-inp" placeholder="Verification code:"/>
                <button id="code-btn" onclick="verifyCode()" class="login-btn">Verify</button>
            </div>
        </div>
<script src="/script.js"></script>
<script>
const logg = document.getElementById('log')
const usrnm = document.getElementById('username-inp');
const email = document.getElementById('email-inp');
const pass = document.getElementById('password-inp');
const pass2 = document.getElementById('password-inp2');
const vcodei = document.getElementById('vcode-inp');
const checkbox = document.getElementById('checkbox')

let sent = false

function allert(inp) {
    const msg = document.getElementById('mssgg')
    msg.innerHTML = inp
    msg.style = `
    color: red;
    display: block;
    width: max-content;
    margin: auto;`
}
usrnm.addEventListener('keydown', (key) => {if (key.key === 'Enter'){ key.preventDefault(); email.focus()}});
email.addEventListener('keydown', (key) => {if (key.key === 'Enter'){ key.preventDefault(); pass.focus()}});
pass.addEventListener('keydown', (key) => {if (key.key === 'Enter'){ key.preventDefault(); pass2.focus()}});
pass2.addEventListener('keydown', (key) => {if (key.key === 'Enter'){ key.preventDefault(); verifyLogin()}});
vcodei.addEventListener('keydown', (key) => {if (key.key === 'Enter'){ key.preventDefault(); verifyCode()}});

usrnm.oninput = function() {usrnm.value = usrnm.value.replace(/[^\w\-]/g, '')};

function verifyLogin(){
    if (usrnm.value && pass.value && email.value && pass2.value){
        if (usrnm.value != pass.value){
            if (pass2.value === pass.value) {
                if(email.checkValidity()){
                    if(checkbox.checked){
                        if(sent) {return}
                        sent = true
                        socket.emit('Register-start', usrnm.value, pass.value, email.value, (callback) => {
                            if (!(callback.success && !callback.error)) {
                                allert(callback.error);
                                sent = false
                            } else {
                                logg.style.display = 'none'
                                const vcd = document.getElementById('vcd');
                                vcd.style.display = 'flex';
                                const cont = document.createElement('div');
                                cont.className = 'vcdcont';
                                const first = document.createElement('span');
                                first.textContent = 'The verification code is sent to ';
                                const eml = document.createElement('span');
                                eml.textContent = email.value;
                                eml.style = 'color: orangered;';
                                const second = document.createElement('span');
                                second.textContent = ' check your inbox and spam ';
                                cont.appendChild(first);
                                cont.appendChild(eml);
                                cont.appendChild(second);
                                vcd.appendChild(cont);
                            }
                        })
                    } else allert('Agree with the TOS to continue')
                } else {
                    allert('Please enter a valid email to proceed')
                }
            } else {
                allert('Passwords do not match');
            };
        } else {
            allert('Username and Password must be different');
        };
    } else {
        allert('Please fill in all fields');
    };
};

function verifyCode() {
    socket.emit('vcode', usrnm.value, vcodei.value, (callback) => {
        if (callback.username && callback.key && !callback.error) {
            document.cookie = `key=${encodeURIComponent(callback.key)}; path=/; max-age=3600; SameSite=Lax`;
            document.cookie = `usrnm=${encodeURIComponent(callback.username)}; path=/; max-age=3600; SameSite=Lax`;
            const {room, redir} = geturlparms()
            window.location.href = redir;
        } else {
            alert(callback.error || 'no error')
        }
    })
}
</script>
</body>
</html>
